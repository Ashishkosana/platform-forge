[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-workflow-engine"
version = "0.1.0"
description = "At-least-once durable step runner (Platform Forge): Postgres leases and fencing tokens"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ashish Kosana" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
workflow = "workflow_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_engine = ["schema.sql", "static/index.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "drills"]
timeout = 180
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "slow: longer failure drills",
  "requires_pg_control: needs permission to stop/start Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "drills", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["workflow_engine"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["call-overload", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
